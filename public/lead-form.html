<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family First - योजनेची मोफत माहिती मिळवा</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Mukta', 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0a0f1d] text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4 relative overflow-x-hidden select-none font-sans">
  
  <!-- Dynamic Glows -->
  <div class="fixed top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-emerald-500/15 rounded-full blur-[140px] pointer-events-none"></div>
  <div class="fixed bottom-10 right-1/4 w-[350px] h-[350px] bg-blue-600/15 rounded-full blur-[140px] pointer-events-none"></div>

  <!-- Main Container -->
  <div class="w-full max-w-md mx-auto relative z-10 flex flex-col items-center justify-center">
    
    <!-- Form Card -->
    <div class="w-full bg-white text-slate-800 rounded-3xl p-5 sm:p-7 shadow-2xl border border-slate-100 relative">
      
      <!-- Form Section -->
      <div id="formSection">
        <!-- Header -->
        <div class="text-center mb-4">
          <div class="inline-flex items-center justify-center gap-1.5 mb-1.5">
            <div class="w-7 h-7 rounded-full bg-emerald-800 flex items-center justify-center text-white shadow-sm">
              <svg class="w-4 h-4 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
              </svg>
            </div>
            <span class="text-lg font-black text-emerald-950 tracking-tight">Family First</span>
          </div>
          
          <h2 id="formHeading" class="text-xl sm:text-2xl font-extrabold text-emerald-800 leading-tight">
            योजनेची मोफत माहिती मिळवा
          </h2>
          <p class="text-xs text-slate-500 mt-1">
            खालील तपशील भरा, आमचे प्रतिनिधी त्वरित संपर्क करतील
          </p>
        </div>

        <div id="errorAlert" class="hidden p-2.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium text-center mb-3"></div>

        <form id="leadForm" class="space-y-3">
          <!-- Name Input -->
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input
              type="text"
              id="fullName"
              required
              placeholder="तुमचे नाव लिहा *"
              class="w-full pl-10 pr-3.5 py-3 bg-slate-50 border-2 border-slate-200 focus:border-emerald-600 focus:bg-white rounded-xl text-slate-800 placeholder-slate-400 text-xs sm:text-sm font-medium transition duration-200 outline-none shadow-xs"
            />
          </div>

          <!-- Mobile Input -->
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
            </div>
            <input
              type="tel"
              id="mobileNumber"
              required
              maxlength="10"
              placeholder="१० अंकी मोबाईल नंबर लिहा *"
              class="w-full pl-10 pr-3.5 py-3 bg-slate-50 border-2 border-slate-200 focus:border-emerald-600 focus:bg-white rounded-xl text-slate-800 placeholder-slate-400 text-xs sm:text-sm font-medium transition duration-200 outline-none shadow-xs"
            />
          </div>

          <!-- Email Input -->
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <input
              type="email"
              id="emailAddress"
              placeholder="ईमेल आयडी लिहा (पर्यायी)"
              class="w-full pl-10 pr-3.5 py-3 bg-slate-50 border-2 border-slate-200 focus:border-emerald-600 focus:bg-white rounded-xl text-slate-800 placeholder-slate-400 text-xs sm:text-sm font-medium transition duration-200 outline-none shadow-xs"
            />
          </div>

          <!-- Product Dropdown -->
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-600">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
              </svg>
            </div>
            <select
              id="productSelect"
              class="w-full pl-10 pr-9 py-3 bg-slate-50 border-2 border-slate-200 focus:border-emerald-600 focus:bg-white rounded-xl text-slate-800 text-xs sm:text-sm font-semibold transition duration-200 outline-none shadow-xs appearance-none cursor-pointer"
            >
              <option value="pension">पेन्शन व निवृत्ती योजना (Retirement & Pension)</option>
              <option value="health_general">आरोग्य विमा / हेल्थ इन्शुरन्स (सर्व कंपन्या)</option>
              <option value="term_insurance">टर्म इन्शुरन्स (Term Insurance)</option>
              <option value="child_future">मुलांचे शिक्षण व लग्न नियोजन फंड</option>
              <option value="investment">गुंतवणूक व हमी बचत योजना (Savings Plan)</option>
              <option value="motor">गाडी / वाहन विमा (Motor Insurance)</option>
            </select>
            <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="submitBtn"
            class="w-full py-3.5 px-5 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-700 hover:to-green-700 text-white font-bold rounded-xl text-sm sm:text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 active:scale-[0.98] transition duration-200 disabled:opacity-60 cursor-pointer"
          >
            <span>माहिती मिळवा</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </form>

        <!-- Privacy Footer -->
        <div class="mt-3.5 text-center flex items-center justify-center gap-1.5 text-xs text-slate-500 font-medium">
          <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          <span>तुमची माहिती १००% सुरक्षित राहील.</span>
        </div>
      </div>

      <!-- Success Section -->
      <div id="successSection" class="hidden text-center py-4">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h3 id="successName" class="text-2xl font-black text-emerald-900 mb-2"></h3>
        <p class="text-slate-600 text-sm mb-6 leading-relaxed">
          तुमची माहिती आम्हाला मिळाली आहे. <strong>Family First (राहुल कुलकर्णी)</strong> चे प्रतिनिधी लवकरच आपल्याशी फोनवर संपर्क साधतील.
        </p>

        <!-- CTAs -->
        <div class="space-y-3 pt-2">
          <a
            id="waLink"
            href="https://wa.me/918421702419"
            target="_blank"
            class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-md transition duration-150"
          >
            थेट WhatsApp वर मेसेज करा
          </a>
          <a
            href="tel:8421702419"
            class="w-full py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition duration-150"
          >
            कॉल करा (8421702419)
          </a>
        </div>
      </div>

    </div>

  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA4vQYHuBy0ngNlb8wquJaoCgg0UfqEwLc",
      authDomain: "familyfirst-e2079.firebaseapp.com",
      projectId: "familyfirst-e2079",
      storageBucket: "familyfirst-e2079.firebasestorage.app",
      messagingSenderId: "879553233203",
      appId: "1:879553233203:web:8f1e8fa3a8bd375edd7e46",
      measurementId: "G-7HT47DL4ZQ"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const productNames = {
      pension: 'पेन्शन व निवृत्ती योजना (Retirement & Pension)',
      health_general: 'आरोग्य विमा / हेल्थ इन्शुरन्स (सर्व कंपन्या)',
      term_insurance: 'टर्म इन्शुरन्स (Term Insurance)',
      child_future: 'मुलांचे शिक्षण व लग्न नियोजन फंड',
      investment: 'गुंतवणूक व हमी बचत योजना (Savings Plan)',
      motor: 'गाडी / वाहन विमा (Motor Insurance)'
    };

    const headings = {
      pension: 'पेन्शन व निवृत्ती योजनेची मोफत माहिती मिळवा',
      health_general: 'आरोग्य विमा (Health Insurance) मोफत माहिती व कोटेशन',
      term_insurance: 'टर्म इन्शुरन्स (Term Insurance) मोफत माहिती व कोटेशन',
      child_future: 'मुलांचे शिक्षण व लग्न नियोजन फंड माहिती',
      investment: 'गुंतवणूक व हमी बचत योजना माहिती',
      motor: 'गाडी / वाहन विमा (Motor Insurance) कोटेशन'
    };

    // Parse URL Params
    const urlParams = new URLSearchParams(window.location.search);
    const paramProduct = urlParams.get('product') || 'pension';
    const paramAssignee = urlParams.get('assignee') || '';

    const productSelect = document.getElementById('productSelect');
    const formHeading = document.getElementById('formHeading');

    if (paramProduct && productSelect) {
      productSelect.value = paramProduct;
      if (headings[paramProduct]) {
        formHeading.innerText = headings[paramProduct];
      }
    }

    productSelect.addEventListener('change', (e) => {
      const p = e.target.value;
      if (headings[p]) {
        formHeading.innerText = headings[p];
      }
    });

    const form = document.getElementById('leadForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');
    const formSection = document.getElementById('formSection');
    const successSection = document.getElementById('successSection');
    const successName = document.getElementById('successName');
    const waLink = document.getElementById('waLink');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      errorAlert.innerText = '';

      const name = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('mobileNumber').value.trim().replace(/\D/g, '');
      const email = document.getElementById('emailAddress').value.trim();
      const selectedProd = productSelect.value;
      const selectedProdName = productNames[selectedProd] || selectedProd;

      if (!name) {
        errorAlert.innerText = 'कृपया आपले नाव लिहा.';
        errorAlert.classList.remove('hidden');
        return;
      }

      if (!phone || phone.length < 10) {
        errorAlert.innerText = 'कृपया वैध १० अंकी मोबाईल नंबर लिहा.';
        errorAlert.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'कृपया थांबा...';

      try {
        const leadId = 'lead_wp_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
        const nameParts = name.split(' ');
        const firstName = nameParts[0] || name;
        const lastName = nameParts.slice(1).join(' ') || '';

        const leadData = {
          id: leadId,
          _id: leadId,
          firstName: firstName,
          lastName: lastName,
          name: name,
          phone: phone,
          email: email || '',
          source: 'WhatsApp Status',
          leadSource: 'WhatsApp Status',
          stage: 'TO_CONTACT',
          leadStage: 'To Contact',
          status: 'NEW',
          leadStatus: 'Interested',
          notes: 'WhatsApp Lead: ' + selectedProdName + ' चौकशी. नाव: ' + name + ', फोन: ' + phone,
          interests: [selectedProdName],
          productInterests: [selectedProd],
          isWebsiteLead: true,
          tags: ['whatsapp-lead', selectedProd, 'public-form'],
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        if (paramAssignee) {
          leadData.assignedEmployeeId = paramAssignee;
        }

        await db.collection('leads').doc(leadId).set(leadData);

        formSection.classList.add('hidden');
        successSection.classList.remove('hidden');
        successName.innerText = 'धन्यवाद, ' + name + '!';
        waLink.href = 'https://wa.me/918421702419?text=' + encodeURIComponent('Namaste, Mi ' + name + '. Mala ' + selectedProdName + ' baddal mahiti havi aahe.');
      } catch (err) {
        console.error('Lead submission error:', err);
        errorAlert.innerText = 'माहिती पाठवताना त्रुटी आली. कृपया 8421702419 या नंबरवर संपर्क करा.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>माहिती मिळवा</span>';
      }
    });
  </script>
</body>
</html>
